<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Animated ASCII NEVOLAM banner">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e6ff"><animate attributeName="stop-color" values="#55e6ff;#b78cff;#7dffb2;#55e6ff" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#b78cff"><animate attributeName="stop-color" values="#b78cff;#7dffb2;#55e6ff;#b78cff" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="300" rx="14" fill="#080b12"/>
  <path d="M0 42H900 M0 258H900" stroke="#243246" stroke-width="1"/>
  <g fill="#718096" font-family="monospace" font-size="12">
    <text x="24" y="27">NEVOLAM // PROFILE.SYS</text>
    <text x="760" y="27">[ ONLINE ]</text>
    <text x="24" y="282">INITIALIZING PERSONAL PROFILE...</text>
  </g>
  <g fill="url(#neon)" font-family="monospace" font-size="43" font-weight="bold" text-anchor="middle" filter="url(#glow)">
    <text x="450" y="105"> _   _ _____ _   _  ___  _        _    __  __</text>
    <text x="450" y="153">| \ | | ____| \ | |/ _ \| |      / \  |  \/  |</text>
    <text x="450" y="201">|  \| |  _| |  \| | | | | |     / _ \ | |\/| |</text>
    <text x="450" y="249">|_|\__|_____|_|\__|\___/|_|____/_/ \_\|_|  |_|</text>
  </g>
  <rect x="24" y="54" width="852" height="1" fill="#1b2a3d">
    <animate attributeName="opacity" values=".25;.9;.25" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="272" fill="#9fb2c8" font-family="monospace" font-size="13" text-anchor="middle">BUILDING WORLDS • WRITING CODE • PLAYING WITH IDEAS</text>
  <rect x="24" y="288" width="10" height="3" fill="#55e6ff">
    <animate attributeName="x" values="24;850;24" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>